name: Ping Services

on:
  push:
    branches: [main, dev]
  schedule:
    - cron: '*/4 * * * *'  # Every 4 minutes to prevent auto-suspend
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend
        run: curl -s -o /dev/null -w "%{http_code}" https://modern-blog-tkzl.onrender.com/health || true
